name: nfs-release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfs-release.yml"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Codex release tag, or blank for latest
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: nfs-release
  cancel-in-progress: false

jobs:
  build:
    name: Patch and build latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
    env:
      TARGET: x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Resolve upstream release
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          upstream_tag="$REQUESTED_TAG"
          if [[ -z "$upstream_tag" ]]; then
            upstream_tag="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          fi
          if [[ ! "$upstream_tag" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Unexpected upstream tag: $upstream_tag" >&2
            exit 1
          fi
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_TAG=$upstream_tag" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=nfs-$upstream_tag" >> "$GITHUB_ENV"
      - name: Check existing release asset
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          asset_name="codex-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz"
          found="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[]? | select(.name == \"$asset_name\") | .name" 2>/dev/null || true)"
          if [[ "$found" == "$asset_name" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release asset already exists: $asset_name"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply NFS patch
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --depth=1 https://github.com/openai/codex.git "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          git switch --detach "$UPSTREAM_TAG"
          python3 <<'PY'
          from pathlib import Path

          cargo = Path("codex-rs/state/Cargo.toml")
          text = cargo.read_text()
          dep = """[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
          libc = { workspace = true }

          """
          if "libc = { workspace = true }" not in text:
              text = text.replace("[lints]\nworkspace = true\n", dep + "[lints]\nworkspace = true\n", 1)
          cargo.write_text(text)

          sqlite = Path("codex-rs/state/src/sqlite.rs")
          text = sqlite.read_text()
          if "use sqlx::sqlite::SqliteJournalMode;" not in text:
              text = text.replace(
                  "use sqlx::sqlite::SqliteConnectOptions;\n",
                  "use sqlx::sqlite::SqliteConnectOptions;\nuse sqlx::sqlite::SqliteJournalMode;\n",
                  1,
              )

          needle = "        let recovery = recover_spec.map_or(RecoveryMode::Unavailable, |spec| spec.recovery);\n"
          replacement = needle + """        let journal_pragma = if journal_mode_for_path(path) == SqliteJournalMode::Truncate {
                      "PRAGMA journal_mode = TRUNCATE"
                  } else {
                      "PRAGMA journal_mode = WAL"
                  };
          """
          if needle not in text:
              raise SystemExit("SQLite recovery hook changed upstream")
          text = text.replace(needle, replacement, 1)

          wal = '                            sqlx::query("PRAGMA journal_mode = WAL")\n'
          if wal not in text:
              raise SystemExit("SQLite WAL initialization changed upstream")
          text = text.replace(wal, "                            sqlx::query(journal_pragma)\n", 1)

          marker = '#[cfg(test)]\n#[path = "sqlite_tests.rs"]\nmod tests;\n'
          helpers = r'''/// Use a rollback journal on NFS because SQLite WAL is unsafe on network filesystems.
          fn journal_mode_for_path(path: &Path) -> SqliteJournalMode {
              if path_is_on_nfs(path) {
                  SqliteJournalMode::Truncate
              } else {
                  SqliteJournalMode::Wal
              }
          }

          #[cfg(any(target_os = "linux", target_os = "macos"))]
          fn path_is_on_nfs(path: &Path) -> bool {
              use std::ffi::CString;
              use std::os::unix::ffi::OsStrExt;

              let target = path.parent().unwrap_or_else(|| Path::new("."));
              let Ok(c_path) = CString::new(target.as_os_str().as_bytes()) else {
                  return true;
              };
              let mut buf: libc::statfs = unsafe { std::mem::zeroed() };
              if unsafe { libc::statfs(c_path.as_ptr(), &mut buf) } != 0 {
                  return true;
              }
              is_nfs_statfs(&buf)
          }

          #[cfg(target_os = "linux")]
          fn is_nfs_statfs(buf: &libc::statfs) -> bool {
              buf.f_type as u64 == libc::NFS_SUPER_MAGIC as u64
          }

          #[cfg(target_os = "macos")]
          fn is_nfs_statfs(buf: &libc::statfs) -> bool {
              buf.f_fstypename.starts_with(&[b'n' as _, b'f' as _, b's' as _, 0])
          }

          #[cfg(not(any(target_os = "linux", target_os = "macos")))]
          fn path_is_on_nfs(_path: &Path) -> bool {
              false
          }

          '''
          if "fn journal_mode_for_path(" not in text:
              if marker not in text:
                  raise SystemExit("SQLite test-module marker changed upstream")
              text = text.replace(marker, helpers + marker, 1)
          sqlite.write_text(text)
          PY
      - if: steps.existing.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - if: steps.existing.outputs.skip != 'true'
        name: Install nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
      - if: steps.existing.outputs.skip != 'true'
        name: Test state crate
        working-directory: codex-rs
        run: cargo nextest run --no-fail-fast -p codex-state
      - if: steps.existing.outputs.skip != 'true'
        name: Remove host test artifacts
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target
          df -h /
      - if: steps.existing.outputs.skip != 'true'
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - if: steps.existing.outputs.skip != 'true'
        name: Install musl build tools
        working-directory: codex-rs
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - if: steps.existing.outputs.skip != 'true'
        name: Configure musl environment
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl=1" >> "$GITHUB_ENV"
      - if: steps.existing.outputs.skip != 'true'
        name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl
      - if: steps.existing.outputs.skip != 'true'
        name: Build musl binaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet --target "$TARGET" --release --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          export CODEX_BWRAP_SHA256="$digest"
          cargo build --quiet --target "$TARGET" --release --bin codex --bin codex-code-mode-host
      - if: steps.existing.outputs.skip != 'true'
        name: Package binaries
        id: package
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/codex-${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz"
          package_dir="${RUNNER_TEMP}/codex-package-${TARGET}"
          python3 "${GITHUB_WORKSPACE}/scripts/build_codex_package.py" \
            --target "$TARGET" \
            --variant codex \
            --entrypoint-bin "target/${TARGET}/release/codex" \
            --code-mode-host-bin "target/${TARGET}/release/codex-code-mode-host" \
            --bwrap-bin "target/${TARGET}/release/bwrap" \
            --package-dir "$package_dir" \
            --archive-output "$archive" \
            --force
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.skip != 'true'
        name: Upload Actions artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-nfs-x86_64-unknown-linux-musl
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 14
          if-no-files-found: error
      - if: steps.existing.outputs.skip != 'true'
        name: Publish fork release
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            # GITHUB_TOKEN cannot push the patched upstream commit when it adds workflow files.
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Codex ${UPSTREAM_TAG} with SQLite NFS fix"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "${ARCHIVE}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Codex ${UPSTREAM_TAG} with SQLite NFS fix" \
              --notes "Based on openai/codex ${UPSTREAM_TAG}. Uses SQLite TRUNCATE journal mode on NFS and WAL on local filesystems."
          fi

  report-failure:
    name: Report automation failure
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
    steps:
      - name: Create failure issue
        shell: bash
        run: |
          set -euo pipefail
          tag="${UPSTREAM_TAG:-unknown-release}"
          title="NFS build failed for ${tag}"
          if [[ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]]; then
            echo "## ${title}" >> "$GITHUB_STEP_SUMMARY"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq 'length')"
          if [[ "$existing" == "0" ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The automated NFS patch or musl build failed for ${tag}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
